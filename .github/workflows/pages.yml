name: pages

# Publishes the replay viewer with the showcase replays alongside it, so a reader can
# watch an agent play from the README without installing anything. That link is worth
# more than any screenshot: it is the difference between claiming the agent did
# something and showing it.

on:
  push:
    branches: [main]
    paths:
      - "viewer/**"
      - "replays/showcase/**"
      - "tools/extract_sprites.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Extract the game sprites
        # The site drew flat colours before this step existed: the viewer was published
        # without the art it draws with, and nobody noticed because the fallback is
        # deliberately quiet. They are extracted here rather than committed, because four
        # thousand files that regenerate in twenty seconds do not belong in a repository.
        run: |
          python -m pip install --quiet pillow
          python tools/extract_sprites.py --out site/assets

      - name: Assemble the site
        run: |
          mkdir -p site/replays
          cp viewer/index.html site/
          cp replays/showcase/*.jsonl.gz site/replays/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
