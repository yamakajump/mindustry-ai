name: pages

# Publishes the replay viewer with the showcase replays alongside it, so a reader can
# watch an agent play from the README without installing anything. That link is worth
# more than any screenshot: it is the difference between claiming the agent did
# something and showing it.

on:
  push:
    branches: [main]
    paths:
      - "viewer/**"
      - "replays/showcase/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          mkdir -p site/replays
          cp viewer/index.html site/
          cp replays/showcase/*.jsonl.gz site/replays/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
