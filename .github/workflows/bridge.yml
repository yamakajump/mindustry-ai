name: bridge

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build the plugin
        working-directory: bridge
        run: ./gradlew jar --no-daemon

      - name: Install test dependencies
        run: pip install pytest pytest-timeout

      - name: Run integration tests
        # Throughput tests are excluded on purpose. A shared runner cannot produce a
        # meaningful performance number, and publishing a meaningless one is worse than
        # publishing none. They are run locally, and recorded in docs/measurements/.
        run: python -m pytest tests/ -v --ignore=tests/test_clock.py
