<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mindustry-ai replay viewer</title>
<style>
  :root {
    --bg: #12121a; --panel: #191922; --line: #2a2a36;
    --text: #e8e6e3; --muted: #85828f; --accent: #ffd37f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 13px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }
  header {
    padding: 9px 14px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
  }
  h1 { font-size: 14px; margin: 0; color: var(--accent); font-weight: 600; }
  .note { color: var(--muted); }
  main { flex: 1; display: flex; min-height: 0; }
  #stage { flex: 1; position: relative; overflow: hidden; background: #05050a; cursor: grab; }
  #stage.dragging { cursor: grabbing; }
  canvas { display: block; position: absolute; inset: 0; }
  aside {
    width: 240px; border-left: 1px solid var(--line); padding: 12px 14px;
    background: var(--panel); overflow-y: auto; flex-shrink: 0;
  }
  aside h2 {
    font-size: 10px; text-transform: uppercase; letter-spacing: .09em;
    color: var(--muted); margin: 16px 0 6px; font-weight: 600;
  }
  aside h2:first-child { margin-top: 0; }
  .row { display: flex; justify-content: space-between; padding: 1px 0; }
  .row span:last-child { color: var(--accent); }
  footer {
    padding: 9px 14px; border-top: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px; background: var(--panel);
  }
  button {
    background: var(--line); color: var(--text); border: 0;
    padding: 5px 12px; border-radius: 4px; cursor: pointer; font: inherit;
  }
  button:hover { background: #38384a; }
  input[type=range] { flex: 1; accent-color: var(--accent); min-width: 80px; }
  select { background: var(--line); color: var(--text); border: 0; padding: 5px; border-radius: 4px; font: inherit; }
  #hint {
    position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; flex-direction: column; gap: 6px;
    color: var(--muted); text-align: center; padding: 20px; pointer-events: none;
  }
  #hint.hidden { display: none; }
  #controls {
    position: absolute; right: 10px; bottom: 10px; display: flex; gap: 6px;
    background: rgba(20,20,28,.85); padding: 6px; border-radius: 6px;
  }
  kbd {
    background: var(--line); border-radius: 3px; padding: 1px 5px; font-size: 11px;
  }
</style>
</head>
<body>
<header>
  <h1>mindustry-ai</h1>
  <span class="note" id="title">no replay loaded</span>
</header>

<main>
  <div id="stage">
    <canvas id="canvas"></canvas>
    <div id="hint">
      <strong>Drop a replay here</strong>
      <span>a <code>.jsonl.gz</code> file, or <code>?replay=path</code> in the URL</span>
    </div>
    <div id="controls">
      <button id="zoom-out">-</button>
      <button id="zoom-in">+</button>
      <button id="fit">Fit</button>
      <button id="follow">Follow core</button>
    </div>
  </div>

  <aside>
    <h2>State</h2>
    <div class="row"><span>step</span><span id="s-step">0</span></div>
    <div class="row"><span>tick</span><span id="s-tick">0</span></div>
    <div class="row"><span>wave</span><span id="s-wave">0</span></div>
    <div class="row"><span>built</span><span id="s-built">0</span></div>
    <h2>Reward</h2>
    <div class="row"><span>this step</span><span id="s-reward">0</span></div>
    <div class="row"><span>cumulative</span><span id="s-total">0</span></div>
    <div class="row"><span>refused</span><span id="s-refused">0</span></div>
    <h2>Core</h2>
    <div id="s-items"></div>
    <h2>View</h2>
    <div class="row"><span>zoom</span><span id="s-zoom">1x</span></div>
    <div class="row"><span>drag</span><span>pan</span></div>
    <div class="row"><span>wheel</span><span>zoom</span></div>
    <div class="row"><span><kbd>space</kbd></span><span>play</span></div>
  </aside>
</main>

<footer>
  <button id="play">Play</button>
  <input type="range" id="scrub" min="0" max="0" value="0">
  <span id="s-position">0 / 0</span>
  <select id="speed">
    <option value="2">2x</option>
    <option value="8" selected>8x</option>
    <option value="30">30x</option>
    <option value="120">120x</option>
  </select>
</footer>

<script>
const TILE = 32;                 // Mindustry draws one world tile as 32 pixels.
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d", { alpha: false });
const stage = document.getElementById("stage");

let replay = null, frames = [], planes = null, spriteIndex = null;

/** Loaded sprite images by file name. `null` while in flight, `false` once known missing. */
const images = new Map();

/**
 * One sprite, fetched the first time something needs it.
 *
 * The whole game is on disk rather than packed into an atlas, so a replay of a copper mine
 * never pays for the sprites of a thorium reactor.
 */
function imageOf(stem) {
  const known = images.get(stem);
  if (known !== undefined) return known || null;

  images.set(stem, null);
  const image = new Image();
  // A sprite arrives after the frame that asked for it, and this viewer only redraws when
  // something changes. Without this the first paint of a replay is the one that sticks,
  // in flat colours, however many sprites land a moment later.
  image.onload = () => { images.set(stem, image); redraw(); };
  image.onerror = () => images.set(stem, false);
  image.src = `assets/sprites/${encodeURIComponent(stem)}.png`;
  return null;
}

/** Coalesce the redraws of a burst of sprites into one, on the next frame. */
let redrawQueued = false;
function redraw() {
  if (redrawQueued) return;
  redrawQueued = true;
  requestAnimationFrame(() => { redrawQueued = false; draw(); });
}

/** A stable variant per tile, the way the engine picks one. */
function frameOf(entry, tile) {
  const frames = entry.frames;
  if (!frames || !frames.length) return null;
  if (frames.length < 2 || tile === undefined) return frames[0];
  let n = (tile ^ 61) ^ (tile >>> 16);
  n = (n + (n << 3)) | 0;
  n = n ^ (n >>> 4);
  n = Math.imul(n, 0x27d4eb2d);
  return frames[((n ^ (n >>> 15)) >>> 0) % frames.length];
}
let position = 0, playing = false, lastTime = 0;
let camera = { x: 0, y: 0, scale: 4, following: false };

/** Inflate a base64 blob written by the recorder. */
async function inflate(b64) {
  const raw = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const stream = new Blob([raw]).stream().pipeThrough(new DecompressionStream("deflate"));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

async function loadAtlas() {
  if (spriteIndex) return;
  const meta = await fetch("assets/index.json").then(r => r.json());
  spriteIndex = meta.sprites;
}

async function load(buffer) {
  const stream = new Blob([buffer]).stream().pipeThrough(new DecompressionStream("gzip"));
  const text = await new Response(stream).text();
  const records = text.trim().split("\n").map(JSON.parse);

  const header = records[0];
  if (header.type !== "header") throw new Error("first record is not a header");
  replay = header;
  frames = records.filter(r => r.type === "frame");

  const tiles = header.width * header.height;
  const [floor, overlay, block, rotation] = await Promise.all(
    ["floor", "overlay", "block", "rotation"].map(k => inflate(header[k]))
  );
  planes = {
    floor: new Uint16Array(floor.buffer, floor.byteOffset, tiles),
    overlay: new Uint16Array(overlay.buffer, overlay.byteOffset, tiles),
    block: new Uint16Array(block.buffer, block.byteOffset, tiles),
    rotation,
  };

  // Each frame's built set is derived once, by replaying the recorded actions in order.
  // Actions carry the block identity, which the tile deltas alone would not.
  const built = new Map();
  for (const frame of frames) {
    const act = frame.act;
    if (act && act.t === "place") built.set(act.y * header.width + act.x, act);
    if (act && act.t === "break") built.delete(act.y * header.width + act.x);
    // A stamp is fifty placements reported as one action, so its cells are unpacked here.
    // Without this a replay of a stamping agent shows an empty map while it builds, which
    // is exactly what it showed for as long as the stamp existed.
    if (act && act.t === "stamp") {
      for (const [x, y, block, rotation] of act.cells || []) {
        built.set(y * header.width + x, {t: "place", b: block, x, y, r: rotation});
      }
    }
    frame.built = new Map(built);
  }

  await loadAtlas();
  document.getElementById("hint").classList.add("hidden");
  document.getElementById("title").textContent =
    `${header.task} on ${header.map}${header.note ? " - " + header.note : ""}`;

  const scrub = document.getElementById("scrub");
  scrub.max = frames.length - 1;
  scrub.value = 0;

  fit();
  seek(0);
}

function spriteFor(id) {
  const entry = replay.palette[String(id)];
  if (!entry || entry.name === "air") return null;
  return spriteIndex[entry.name] || null;
}

function fit() {
  if (!replay) return;
  camera.scale = Math.min(canvas.width / (replay.width * TILE), canvas.height / (replay.height * TILE));
  camera.x = replay.width * TILE / 2;
  camera.y = replay.height * TILE / 2;
  camera.following = false;
  draw();
}

function focusCore() {
  if (!replay || replay.core[0] < 0) return;
  camera.x = replay.core[0] * TILE;
  camera.y = (replay.height - 1 - replay.core[1]) * TILE;
  camera.scale = Math.max(camera.scale, 1.4);
  camera.following = true;
  draw();
}

function resize() {
  const ratio = window.devicePixelRatio || 1;
  canvas.width = stage.clientWidth * ratio;
  canvas.height = stage.clientHeight * ratio;
  canvas.style.width = stage.clientWidth + "px";
  canvas.style.height = stage.clientHeight + "px";
  draw();
}

function blit(sprite, tileX, tileY, tilesWide, rotation) {
  // Mindustry counts y from the bottom, canvas from the top.
  const size = tilesWide * TILE;
  const px = tileX * TILE - (tilesWide - 1) * TILE / 2;
  const py = (replay.height - 1 - tileY) * TILE - (tilesWide - 1) * TILE / 2;

  const image = imageOf(frameOf(sprite, tileY * replay.width + tileX));
  if (!image) return;

  if (rotation) {
    ctx.save();
    ctx.translate(px + size / 2, py + size / 2);
    // Rotation 0 points right in game; sprites are drawn pointing right.
    ctx.rotate(-rotation * Math.PI / 2);
    ctx.drawImage(image, -size / 2, -size / 2, size, size);
    ctx.restore();
  } else {
    ctx.drawImage(image, px, py, size, size);
  }
}

function draw() {
  if (!replay || !planes || !spriteIndex) return;
  const { width, height } = replay;

  ctx.fillStyle = "#05050a";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  ctx.translate(canvas.width / 2, canvas.height / 2);
  ctx.scale(camera.scale, camera.scale);
  ctx.translate(-camera.x, -camera.y);
  ctx.imageSmoothingEnabled = false;

  // Only the visible window is drawn: a 256x256 map is 65k tiles, and painting all of
  // them every frame drops the viewer to single digit frames per second when zoomed in.
  const halfW = canvas.width / (2 * camera.scale);
  const halfH = canvas.height / (2 * camera.scale);
  const minX = Math.max(0, Math.floor((camera.x - halfW) / TILE) - 1);
  const maxX = Math.min(width - 1, Math.ceil((camera.x + halfW) / TILE) + 1);
  const minYpx = camera.y - halfH, maxYpx = camera.y + halfH;
  const minY = Math.max(0, height - 1 - Math.ceil(maxYpx / TILE) - 1);
  const maxY = Math.min(height - 1, height - 1 - Math.floor(minYpx / TILE) + 1);

  const frame = frames[position];

  for (let y = minY; y <= maxY; y++) {
    for (let x = minX; x <= maxX; x++) {
      const index = y * width + x;

      const floor = spriteFor(planes.floor[index]);
      if (floor) blit(floor, x, y, 1, 0);

      const overlay = spriteFor(planes.overlay[index]);
      if (overlay) blit(overlay, x, y, 1, 0);

      const wall = spriteFor(planes.block[index]);
      if (wall) {
        const entry = replay.palette[String(planes.block[index])];
        const size = entry.size || 1;
        // Multi-tile blocks are stored on every tile they cover but drawn once, from
        // their centre, or a 3x3 core would be painted nine times.
        if (size === 1 || isCentre(x, y, index, planes.block[index], size)) {
          blit(wall, x, y, size, 0);
        }
      }
    }
  }

  if (frame) {
    for (const [key, act] of frame.built) {
      const x = key % width, y = Math.floor(key / width);
      if (x < minX || x > maxX || y < minY || y > maxY) continue;
      const sprite = spriteIndex[act.b];
      if (sprite) blit(sprite, x, y, sprite.tiles, act.r || 0);
    }
  }

  const [cx, cy] = replay.core;
  if (cx >= 0) {
    ctx.strokeStyle = "rgba(255,211,127,.65)";
    ctx.lineWidth = 2 / camera.scale;
    ctx.strokeRect((cx - 2.5) * TILE, (height - 1 - cy - 2.5) * TILE, TILE * 6, TILE * 6);
  }

  ctx.restore();
  document.getElementById("s-zoom").textContent = camera.scale.toFixed(2) + "x";
}

/** Whether this tile is where a multi-tile block should be drawn from. */
function isCentre(x, y, index, id, size) {
  const half = Math.floor(size / 2);
  for (let dy = -half; dy <= half; dy++) {
    for (let dx = -half; dx <= half; dx++) {
      const nx = x + dx, ny = y + dy;
      if (nx < 0 || ny < 0 || nx >= replay.width || ny >= replay.height) return false;
      if (planes.block[ny * replay.width + nx] !== id) return false;
    }
  }
  // The centre is the tile whose whole footprint matches and which has no matching
  // neighbour below-left, so exactly one tile of the block satisfies it.
  const below = y - half - 1, left = x - half - 1;
  const sameBelow = below >= 0 && planes.block[below * replay.width + x] === id;
  const sameLeft = left >= 0 && planes.block[y * replay.width + left] === id;
  return !(sameBelow && sameLeft);
}

function seek(index) {
  position = Math.max(0, Math.min(index, frames.length - 1));
  const frame = frames[position];
  document.getElementById("scrub").value = position;
  document.getElementById("s-position").textContent = `${position} / ${frames.length - 1}`;
  document.getElementById("s-step").textContent = frame.step;
  document.getElementById("s-tick").textContent = frame.tick;
  document.getElementById("s-wave").textContent = frame.wave;
  document.getElementById("s-built").textContent = frame.built.size;
  document.getElementById("s-reward").textContent = frame.reward.toFixed(3);

  let total = 0, refused = 0;
  for (let i = 0; i <= position; i++) {
    total += frames[i].reward;
    refused += frames[i].refused || 0;
  }
  document.getElementById("s-total").textContent = total.toFixed(3);
  document.getElementById("s-refused").textContent = refused;
  document.getElementById("s-items").innerHTML =
    Object.entries(frame.items || {}).map(([name, amount]) =>
      `<div class="row"><span>${name}</span><span>${amount}</span></div>`).join("")
    || '<div class="row"><span>empty</span><span>0</span></div>';

  draw();
}

function tick(now) {
  if (playing && frames.length) {
    if (now - lastTime > 1000 / Number(document.getElementById("speed").value)) {
      lastTime = now;
      if (position >= frames.length - 1) setPlaying(false);
      else seek(position + 1);
    }
  }
  requestAnimationFrame(tick);
}

function setPlaying(value) {
  playing = value;
  document.getElementById("play").textContent = value ? "Pause" : "Play";
}

// Pan and zoom -----------------------------------------------------------------
let dragging = false, dragStart = null;
stage.addEventListener("mousedown", e => {
  dragging = true; camera.following = false;
  dragStart = { x: e.clientX, y: e.clientY, cx: camera.x, cy: camera.y };
  stage.classList.add("dragging");
});
window.addEventListener("mousemove", e => {
  if (!dragging) return;
  const ratio = window.devicePixelRatio || 1;
  camera.x = dragStart.cx - (e.clientX - dragStart.x) * ratio / camera.scale;
  camera.y = dragStart.cy - (e.clientY - dragStart.y) * ratio / camera.scale;
  draw();
});
window.addEventListener("mouseup", () => { dragging = false; stage.classList.remove("dragging"); });

stage.addEventListener("wheel", e => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.2 : 1 / 1.2;
  camera.scale = Math.min(8, Math.max(0.05, camera.scale * factor));
  draw();
}, { passive: false });

document.getElementById("zoom-in").onclick = () => { camera.scale = Math.min(8, camera.scale * 1.4); draw(); };
document.getElementById("zoom-out").onclick = () => { camera.scale = Math.max(0.05, camera.scale / 1.4); draw(); };
document.getElementById("fit").onclick = fit;
document.getElementById("follow").onclick = focusCore;
document.getElementById("play").onclick = () => {
  if (position >= frames.length - 1) seek(0);
  setPlaying(!playing);
};
document.getElementById("scrub").oninput = e => { setPlaying(false); seek(Number(e.target.value)); };

document.addEventListener("keydown", e => {
  if (e.key === " ") { e.preventDefault(); document.getElementById("play").click(); }
  if (e.key === "ArrowRight") { setPlaying(false); seek(position + 1); }
  if (e.key === "ArrowLeft") { setPlaying(false); seek(position - 1); }
  if (e.key === "f") focusCore();
});

stage.addEventListener("dragover", e => e.preventDefault());
stage.addEventListener("drop", async e => {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if (file) load(await file.arrayBuffer()).catch(err => alert(err.message));
});

window.addEventListener("resize", resize);
resize();

const requested = new URLSearchParams(location.search).get("replay");
if (requested) {
  fetch(requested)
    .then(r => r.ok ? r.arrayBuffer() : Promise.reject(new Error("HTTP " + r.status)))
    .then(load)
    .catch(err => {
      document.getElementById("title").textContent = `could not load ${requested}: ${err.message}`;
    });
}

requestAnimationFrame(tick);
</script>
</body>
</html>
