<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mindustry-ai replay viewer</title>
<style>
  :root {
    --bg: #14141a;
    --panel: #1c1c24;
    --line: #2c2c38;
    --text: #e8e6e3;
    --muted: #8b8898;
    --accent: #ffd37f;
    --accent-dim: #a8863f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: baseline;
    gap: 16px;
    flex-wrap: wrap;
  }
  h1 { font-size: 15px; margin: 0; color: var(--accent); font-weight: 600; }
  .note { color: var(--muted); font-size: 13px; }
  main { flex: 1; display: flex; min-height: 0; }
  #stage { flex: 1; position: relative; overflow: hidden; background: #0e0e13; }
  canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
  aside {
    width: 260px;
    border-left: 1px solid var(--line);
    padding: 14px 16px;
    background: var(--panel);
    overflow-y: auto;
  }
  aside h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--muted);
    margin: 18px 0 8px;
    font-weight: 600;
  }
  aside h2:first-child { margin-top: 0; }
  .row { display: flex; justify-content: space-between; padding: 2px 0; }
  .row span:last-child { color: var(--accent); }
  footer {
    padding: 10px 16px;
    border-top: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--panel);
  }
  button {
    background: var(--line);
    color: var(--text);
    border: 0;
    padding: 6px 14px;
    border-radius: 4px;
    cursor: pointer;
    font: inherit;
  }
  button:hover { background: #3a3a48; }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  select { background: var(--line); color: var(--text); border: 0; padding: 6px; border-radius: 4px; font: inherit; }
  #drop {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 8px;
    color: var(--muted); text-align: center; padding: 24px;
  }
  #drop.hidden { display: none; }
  .legend { display: flex; align-items: center; gap: 6px; padding: 1px 0; font-size: 13px; }
  .swatch { width: 11px; height: 11px; border-radius: 2px; }
</style>
</head>
<body>
<header>
  <h1>mindustry-ai</h1>
  <span class="note" id="title">no replay loaded</span>
</header>

<main>
  <div id="stage">
    <canvas id="canvas"></canvas>
    <div id="drop">
      <strong>Drop a replay here</strong>
      <span>a <code>.jsonl.gz</code> file from <code>replays/</code></span>
      <span>or append <code>?replay=path/to/file.jsonl.gz</code> to the URL</span>
    </div>
  </div>

  <aside>
    <h2>State</h2>
    <div class="row"><span>step</span><span id="s-step">0</span></div>
    <div class="row"><span>tick</span><span id="s-tick">0</span></div>
    <div class="row"><span>wave</span><span id="s-wave">0</span></div>
    <div class="row"><span>blocks</span><span id="s-blocks">0</span></div>
    <h2>Reward</h2>
    <div class="row"><span>this step</span><span id="s-reward">0</span></div>
    <div class="row"><span>cumulative</span><span id="s-total">0</span></div>
    <div class="row"><span>refused</span><span id="s-refused">0</span></div>
    <h2>Core items</h2>
    <div id="s-items"></div>
    <h2>Legend</h2>
    <div id="s-legend"></div>
  </aside>
</main>

<footer>
  <button id="play">Play</button>
  <input type="range" id="scrub" min="0" max="0" value="0">
  <span id="s-position">0 / 0</span>
  <select id="speed">
    <option value="1">1x</option>
    <option value="4" selected>4x</option>
    <option value="16">16x</option>
    <option value="60">60x</option>
  </select>
</footer>

<script>
// Palette follows Mindustry's own, so a player recognises what they are looking at.
const COLOURS = {
  floor: "#22222b",
  solid: "#33333f",
  block: "#ffd37f",
  core: "#ffe9b0",
  ore: {
    copper: "#d99d73", lead: "#8c7fa9", sand: "#f7cba4", coal: "#3f4049",
    titanium: "#8da3c9", thorium: "#f9a3c7", scrap: "#8c8c8c", beryllium: "#5aa387",
  },
};

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
let replay = null;
let frames = [];
let terrain = null;
let position = 0;
let playing = false;
let lastFrameTime = 0;

/** Inflate a base64 blob written by the recorder. */
async function inflate(b64, format) {
  const raw = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const stream = new Blob([raw]).stream().pipeThrough(new DecompressionStream(format));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

async function load(buffer) {
  const stream = new Blob([buffer]).stream().pipeThrough(new DecompressionStream("gzip"));
  const text = await new Response(stream).text();

  const records = text.trim().split("\n").map(JSON.parse);
  const header = records[0];
  if (header.type !== "header") throw new Error("first record is not a header");

  replay = header;
  frames = records.filter(r => r.type === "frame");
  const solid = await inflate(header.solid, "deflate");
  const ores = await inflate(header.ores, "deflate");
  terrain = { solid, ores };

  // Blocks are stored as deltas, so each frame's full set is built once up front.
  const present = new Set();
  for (const frame of frames) {
    for (const [x, y] of frame.removed || []) present.delete(y * header.width + x);
    for (const [x, y] of frame.added || []) present.add(y * header.width + x);
    frame.blocks = new Set(present);
  }

  document.getElementById("drop").classList.add("hidden");
  document.getElementById("title").textContent =
    `${header.task} on ${header.map}${header.note ? " - " + header.note : ""}`;

  const scrub = document.getElementById("scrub");
  scrub.max = frames.length - 1;
  scrub.value = 0;

  buildLegend(header);
  resize();
  seek(0);
}

function buildLegend(header) {
  const box = document.getElementById("s-legend");
  const rows = [["built", COLOURS.block], ["wall", COLOURS.solid]];
  for (const name of header.ore_names) rows.push([name, COLOURS.ore[name] || "#777"]);
  box.innerHTML = rows.map(([label, colour]) =>
    `<div class="legend"><span class="swatch" style="background:${colour}"></span>${label}</div>`
  ).join("");
}

function resize() {
  if (!replay) return;
  const stage = document.getElementById("stage");
  const scale = Math.max(1, Math.floor(
    Math.min(stage.clientWidth / replay.width, stage.clientHeight / replay.height)
  ));
  canvas.width = replay.width * scale;
  canvas.height = replay.height * scale;
  canvas.style.width = canvas.width + "px";
  canvas.style.height = canvas.height + "px";
  canvas.style.margin = "auto";
  canvas.style.position = "absolute";
  canvas.style.inset = "0";
  draw();
}

function draw() {
  if (!replay || !terrain) return;
  const { width, height } = replay;
  const scale = canvas.width / width;
  const frame = frames[position];

  const image = ctx.createImageData(canvas.width, canvas.height);
  const data = image.data;

  const paint = (x, y, hex) => {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    // y is flipped: Mindustry counts from the bottom, canvas from the top.
    const top = (height - 1 - y) * scale;
    for (let dy = 0; dy < scale; dy++) {
      let offset = ((top + dy) * canvas.width + x * scale) * 4;
      for (let dx = 0; dx < scale; dx++) {
        data[offset++] = r; data[offset++] = g; data[offset++] = b; data[offset++] = 255;
      }
    }
  };

  for (let y = 0; y < height; y++) {
    for (let x = 0; x < width; x++) {
      const index = y * width + x;
      let colour = COLOURS.floor;
      if (terrain.solid[index]) colour = COLOURS.solid;
      const ore = terrain.ores[index];
      if (ore) colour = COLOURS.ore[replay.ore_names[ore - 1]] || "#777";
      if (frame && frame.blocks.has(index)) colour = COLOURS.block;
      paint(x, y, colour);
    }
  }
  ctx.putImageData(image, 0, 0);

  // The core is worth marking: everything the agent does is relative to it.
  const [cx, cy] = replay.core;
  if (cx >= 0) {
    ctx.strokeStyle = COLOURS.core;
    ctx.lineWidth = Math.max(1, scale / 2);
    ctx.strokeRect(
      (cx - 2) * scale, (height - 1 - cy - 2) * scale, scale * 5, scale * 5
    );
  }
}

function seek(index) {
  position = Math.max(0, Math.min(index, frames.length - 1));
  const frame = frames[position];
  document.getElementById("scrub").value = position;
  document.getElementById("s-position").textContent = `${position} / ${frames.length - 1}`;
  document.getElementById("s-step").textContent = frame.step;
  document.getElementById("s-tick").textContent = frame.tick;
  document.getElementById("s-wave").textContent = frame.wave;
  document.getElementById("s-blocks").textContent = frame.blocks.size;
  document.getElementById("s-reward").textContent = frame.reward.toFixed(3);

  let total = 0, refused = 0;
  for (let i = 0; i <= position; i++) {
    total += frames[i].reward;
    refused += frames[i].refused || 0;
  }
  document.getElementById("s-total").textContent = total.toFixed(3);
  document.getElementById("s-refused").textContent = refused;

  document.getElementById("s-items").innerHTML =
    Object.entries(frame.items || {}).map(([name, amount]) =>
      `<div class="row"><span>${name}</span><span>${amount}</span></div>`
    ).join("") || '<div class="row"><span>empty</span><span>0</span></div>';

  draw();
}

function tick(now) {
  if (playing && frames.length) {
    const rate = 1000 / Number(document.getElementById("speed").value);
    if (now - lastFrameTime > rate) {
      lastFrameTime = now;
      if (position >= frames.length - 1) setPlaying(false);
      else seek(position + 1);
    }
  }
  requestAnimationFrame(tick);
}

function setPlaying(value) {
  playing = value;
  document.getElementById("play").textContent = value ? "Pause" : "Play";
}

document.getElementById("play").onclick = () => {
  if (position >= frames.length - 1) seek(0);
  setPlaying(!playing);
};
document.getElementById("scrub").oninput = e => { setPlaying(false); seek(Number(e.target.value)); };
window.onresize = resize;

document.addEventListener("keydown", e => {
  if (e.key === " ") { e.preventDefault(); document.getElementById("play").click(); }
  if (e.key === "ArrowRight") { setPlaying(false); seek(position + 1); }
  if (e.key === "ArrowLeft") { setPlaying(false); seek(position - 1); }
});

const stage = document.getElementById("stage");
stage.addEventListener("dragover", e => e.preventDefault());
stage.addEventListener("drop", async e => {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if (file) load(await file.arrayBuffer());
});

const requested = new URLSearchParams(location.search).get("replay");
if (requested) {
  fetch(requested)
    .then(r => r.ok ? r.arrayBuffer() : Promise.reject(new Error(r.status)))
    .then(load)
    .catch(err => {
      document.getElementById("title").textContent = `could not load ${requested}: ${err}`;
    });
}

requestAnimationFrame(tick);
</script>
</body>
</html>
