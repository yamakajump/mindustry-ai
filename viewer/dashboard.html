<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mindustry-ai training</title>
<style>
  :root {
    --bg: #0e0e14; --panel: #16161f; --line: #262633;
    --text: #eae8e4; --muted: #8a8797; --accent: #ffd37f;
    --good: #7ddc9a; --bad: #e8737d; --ore: #d99d73;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 13px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  header {
    padding: 11px 18px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
    position: sticky; top: 0; background: var(--bg); z-index: 5;
  }
  h1 { font-size: 15px; margin: 0; color: var(--accent); font-weight: 600; }
  .stat { display: flex; flex-direction: column; }
  .stat b { font-size: 17px; font-weight: 600; }
  .stat span { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .07em; }
  .right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
  #lang {
    background: var(--line); color: var(--text); border: 0;
    padding: 5px 10px; border-radius: 4px; cursor: pointer; font: inherit;
  }

  main { padding: 16px; display: grid; grid-template-columns: 1fr 320px; gap: 16px; align-items: start; }
  @media (max-width: 1100px) { main { grid-template-columns: 1fr } }

  #matches { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; }
  .match {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 12px; display: flex; flex-direction: column; gap: 8px; cursor: pointer;
    transition: border-color .15s;
  }
  .match:hover { border-color: var(--accent); }
  .match.dead { opacity: .4; }
  .match header { padding: 0; border: 0; position: static; background: none; display: flex; align-items: baseline; gap: 8px; }
  .policy { color: var(--accent); font-weight: 600; }
  .badge { font-size: 10px; padding: 1px 7px; border-radius: 10px; background: var(--line); color: var(--muted); text-transform: uppercase; }
  canvas.map { width: 100%; height: 170px; background: #05050a; border-radius: 5px; display: block; image-rendering: pixelated; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); transition: width .25s; }
  .rows { display: grid; grid-template-columns: 1fr 1fr; gap: 1px 12px; }
  .row { display: flex; justify-content: space-between; }
  .row span:first-child { color: var(--muted); }
  .watch {
    background: rgba(125,220,154,.12); border: 1px solid rgba(125,220,154,.35);
    color: var(--good); border-radius: 5px; padding: 5px 8px; font-size: 12px;
    display: none;
  }
  .watch.on { display: block; }
  .watch b { color: var(--text); }
  .items { display: flex; flex-wrap: wrap; gap: 5px; }
  .item { background: var(--line); border-radius: 4px; padding: 1px 7px; }
  .item b { color: var(--ore); font-weight: 600; }

  aside { display: flex; flex-direction: column; gap: 14px; position: sticky; top: 72px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
  .card h2 { font-size: 10px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin: 0 0 9px; font-weight: 600; }
  ol { margin: 0; padding-left: 20px; }
  ol li b { color: var(--accent); }
  .empty { color: var(--muted); padding: 24px; text-align: center; }

  /* Detail view: the same match, big enough to actually watch. */
  #detail {
    position: fixed; inset: 0; background: rgba(6,6,10,.94); z-index: 20;
    display: none; flex-direction: column; padding: 16px;
  }
  #detail.open { display: flex; }
  #detail header { background: none; border: 0; position: static; padding: 0 0 10px; }
  #detail canvas { flex: 1; width: 100%; background: #05050a; border-radius: 6px; image-rendering: pixelated; }
  #detail .strip { display: flex; gap: 22px; padding-top: 10px; flex-wrap: wrap; }
  .close { margin-left: auto; background: var(--line); border: 0; color: var(--text); padding: 6px 14px; border-radius: 4px; cursor: pointer; font: inherit; }
</style>
</head>
<body>
<header>
  <h1>mindustry-ai</h1>
  <div class="stat"><b id="s-task">-</b><span data-i18n="task">task</span></div>
  <div class="stat"><b id="s-matches">0</b><span data-i18n="matches">matches</span></div>
  <div class="stat"><b id="s-episodes">0</b><span data-i18n="episodes">episodes</span></div>
  <div class="stat"><b id="s-updates">0</b><span data-i18n="generations">generations</span></div>
  <div class="stat"><b id="s-bestwave">0</b><span data-i18n="bestWave">best wave</span></div>
  <div class="stat"><b id="s-sps">0</b><span data-i18n="stepsPerSecond">steps/s</span></div>
  <div class="stat"><b id="s-elapsed">0s</b><span data-i18n="elapsed">elapsed</span></div>
  <div class="right">
    <button id="lang">FR</button>
    <span class="dot"></span><span id="s-live" data-i18n="connecting">connecting</span>
  </div>
</header>

<main>
  <div id="matches"><div class="empty" data-i18n="waiting">waiting for matches...</div></div>
  <aside>
    <div class="card">
      <h2 data-i18n="objective">Objective</h2>
      <div id="s-objective">-</div>
    </div>
    <div class="card">
      <h2 data-i18n="learningCurve">Learning curve</h2>
      <canvas id="learning" height="150"></canvas>
      <div class="row" style="margin-top:7px"><span data-i18n="meanReward">mean reward</span><span id="s-curmean">-</span></div>
      <div class="row"><span data-i18n="vsFirst">vs first generation</span><span id="s-delta">-</span></div>
      <div class="row"><span data-i18n="entropy">entropy</span><span id="s-entropy">-</span></div>
    </div>
    <div class="card">
      <h2 data-i18n="leaderboard">Leaderboard</h2>
      <ol id="s-leaderboard"><li class="empty" data-i18n="noResults">no results yet</li></ol>
    </div>
  </aside>
</main>

<div id="detail">
  <header>
    <h1 id="d-title">match</h1>
    <button class="close" id="d-close" data-i18n="close">close</button>
  </header>
  <canvas id="d-canvas"></canvas>
  <div class="strip">
    <div class="stat"><b id="d-step">0</b><span data-i18n="step">step</span></div>
    <div class="stat"><b id="d-wave">0</b><span data-i18n="wave">wave</span></div>
    <div class="stat"><b id="d-reward">0</b><span data-i18n="reward">reward</span></div>
    <div class="stat"><b id="d-built">0</b><span data-i18n="built">built</span></div>
    <div class="stat"><b id="d-action">-</b><span data-i18n="action">action</span></div>
    <div class="stat"><b id="d-items">-</b><span data-i18n="core">core</span></div>
  </div>
</div>

<script>
// Interface language -----------------------------------------------------------
const STRINGS = {
  en: { task:"task", matches:"matches", episodes:"episodes", generations:"generations",
        bestWave:"best wave", stepsPerSecond:"steps/s", elapsed:"elapsed",
        connecting:"connecting", live:"live", disconnected:"disconnected",
        waiting:"waiting for matches...", objective:"Objective",
        learningCurve:"Learning curve", meanReward:"mean reward",
        vsFirst:"vs first generation", entropy:"entropy", leaderboard:"Leaderboard",
        noResults:"no results yet", close:"close", step:"step", wave:"wave",
        reward:"reward", built:"built", action:"action", core:"core", solved:"solved",
        watchInGame:"Join in Mindustry:", realGame:"Watch in the real game" },
  fr: { task:"tâche", matches:"parties", episodes:"épisodes", generations:"générations",
        bestWave:"meilleure vague", stepsPerSecond:"pas/s", elapsed:"durée",
        connecting:"connexion", live:"en direct", disconnected:"déconnecté",
        waiting:"en attente des parties...", objective:"Objectif",
        learningCurve:"Courbe d'apprentissage", meanReward:"récompense moyenne",
        vsFirst:"vs première génération", entropy:"entropie", leaderboard:"Classement",
        noResults:"aucun résultat", close:"fermer", step:"pas", wave:"vague",
        reward:"récompense", built:"construit", action:"action", core:"core", solved:"résolus",
        watchInGame:"Rejoindre dans Mindustry :", realGame:"Voir dans le vrai jeu" },
};
let lang = localStorage.getItem("lang") || "en";

function applyLanguage() {
  document.documentElement.lang = lang;
  document.getElementById("lang").textContent = lang === "en" ? "FR" : "EN";
  for (const node of document.querySelectorAll("[data-i18n]")) {
    const key = node.dataset.i18n;
    if (STRINGS[lang][key]) node.textContent = STRINGS[lang][key];
  }
  // Cards carry translated labels of their own, so they are rebuilt on a change.
  for (const card of cards.values()) card.remove();
  cards.clear();
}
const t = key => (STRINGS[lang] && STRINGS[lang][key]) || key;

// Sprites ----------------------------------------------------------------------
let atlas = null, atlasIndex = null;
const terrains = new Map();     // match index -> decoded map
const cards = new Map();
let detailIndex = null;

async function loadAtlas() {
  if (atlas || atlasIndex === false) return;
  try {
    const meta = await (await fetch("assets/atlas.json")).json();
    const image = new Image();
    await new Promise((ok, no) => { image.onload = ok; image.onerror = no; image.src = "assets/atlas.png"; });
    atlas = image;
    atlasIndex = meta.sprites;
  } catch {
    // No atlas: fall back to flat colours rather than showing nothing at all.
    atlasIndex = false;
  }
}

async function inflate(b64) {
  const raw = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const stream = new Blob([raw]).stream().pipeThrough(new DecompressionStream("deflate"));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

/** Fetch and decode a match's map. Cached until the episode changes it. */
const pending = new Set();
async function loadTerrain(index, version) {
  const known = terrains.get(index);
  if (known && known.version === version) return known;
  if (pending.has(index)) return known || null;

  pending.add(index);
  try {
    const data = await (await fetch(`terrain/${index}`, { cache: "no-store" })).json();
    const tiles = data.width * data.height;
    const [floor, overlay, block] = await Promise.all(
      ["floor", "overlay", "block"].map(k => inflate(data[k]))
    );
    const decoded = {
      version, width: data.width, height: data.height, palette: data.palette,
      floor: new Uint16Array(floor.buffer, floor.byteOffset, tiles),
      overlay: new Uint16Array(overlay.buffer, overlay.byteOffset, tiles),
      block: new Uint16Array(block.buffer, block.byteOffset, tiles),
    };
    terrains.set(index, decoded);
    return decoded;
  } catch {
    return known || null;
  } finally {
    pending.delete(index);
  }
}

const FALLBACK = { floor: "#22222b", solid: "#33333f", built: "#7ddc9a" };

/** Draw one match with the game's own sprites when they are available. */
function drawMap(canvas, match, terrain, zoom) {
  const ctx = canvas.getContext("2d");
  const ratio = window.devicePixelRatio || 1;
  const width = Math.max(1, Math.round(canvas.clientWidth * ratio));
  const height = Math.max(1, Math.round(canvas.clientHeight * ratio));
  if (canvas.width !== width || canvas.height !== height) { canvas.width = width; canvas.height = height; }

  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = "#05050a";
  ctx.fillRect(0, 0, width, height);
  if (!terrain) return;

  const [coreX, coreY] = match.core;
  const mapW = terrain.width, mapH = terrain.height;

  // Zoomed views follow the agent, so the detail view shows the base rather than the map.
  const span = zoom ? Math.min(zoom, Math.min(mapW, mapH)) : Math.max(mapW, mapH);
  const unit = match.unit || {};
  const centreX = zoom ? (unit.x !== undefined ? unit.x : (coreX >= 0 ? coreX : mapW / 2)) : mapW / 2;
  const centreY = zoom ? (unit.y !== undefined ? unit.y : (coreY >= 0 ? coreY : mapH / 2)) : mapH / 2;

  const scale = Math.min(width, height) / span;
  const originX = Math.max(0, Math.min(centreX - span / 2, mapW - span));
  const originY = Math.max(0, Math.min(centreY - span / 2, mapH - span));
  const put = (x, y) => [(x - originX) * scale, (mapH - 1 - y - originY) * scale];

  const sprite = id => {
    if (!atlasIndex) return null;
    const entry = terrain.palette[String(id)];
    if (!entry || entry.name === "air") return null;
    return atlasIndex[entry.name] || null;
  };

  const minX = Math.max(0, Math.floor(originX)), maxX = Math.min(mapW - 1, Math.ceil(originX + span));
  const minY = Math.max(0, Math.floor(originY)), maxY = Math.min(mapH - 1, Math.ceil(originY + span));
  const cell = Math.max(1, Math.ceil(scale));

  for (let y = minY; y <= maxY; y++) {
    for (let x = minX; x <= maxX; x++) {
      const i = y * mapW + x;
      const [px, py] = put(x, y);

      const floorSprite = sprite(terrain.floor[i]);
      if (floorSprite) {
        ctx.drawImage(atlas, floorSprite.x, floorSprite.y, floorSprite.w, floorSprite.h, px, py, cell, cell);
      } else {
        ctx.fillStyle = FALLBACK.floor;
        ctx.fillRect(px, py, cell, cell);
      }

      const overlaySprite = sprite(terrain.overlay[i]);
      if (overlaySprite) {
        ctx.drawImage(atlas, overlaySprite.x, overlaySprite.y, overlaySprite.w, overlaySprite.h, px, py, cell, cell);
      }

      if (terrain.block[i]) {
        const blockSprite = sprite(terrain.block[i]);
        if (blockSprite) {
          ctx.drawImage(atlas, blockSprite.x, blockSprite.y, blockSprite.w, blockSprite.h, px, py, cell, cell);
        } else {
          ctx.fillStyle = FALLBACK.solid;
          ctx.fillRect(px, py, cell, cell);
        }
      }
    }
  }

  // What the agent built, drawn on top with its own sprite.
  for (const entry of match.built) {
    const bx = entry[0], by = entry[1], name = entry[2];
    if (bx < minX || bx > maxX || by < minY || by > maxY) continue;
    const [px, py] = put(bx, by);
    const s = (atlasIndex && name) ? atlasIndex[name] : null;
    if (s) {
      const size = cell * (s.tiles || 1);
      ctx.drawImage(atlas, s.x, s.y, s.w, s.h, px, py, size, size);
    } else {
      ctx.fillStyle = FALLBACK.built;
      ctx.fillRect(px, py, cell, cell);
    }
  }

  if (coreX >= 0) {
    const [cx, cy] = put(coreX, coreY);
    ctx.strokeStyle = "rgba(255,211,127,.75)";
    ctx.lineWidth = Math.max(1, scale / 3);
    ctx.strokeRect(cx - scale * 1.5, cy - scale * 1.5, scale * 4, scale * 4);
  }
  if (unit.x !== undefined) {
    const [ux, uy] = put(unit.x, unit.y);
    ctx.strokeStyle = "#8fd0ff";
    ctx.lineWidth = Math.max(1.5, scale / 3);
    ctx.beginPath();
    ctx.arc(ux, uy, Math.max(4, scale * 1.2), 0, Math.PI * 2);
    ctx.stroke();
    if (unit.mining) { ctx.fillStyle = "rgba(143,208,255,.55)"; ctx.fill(); }
  }
}

// Cards ------------------------------------------------------------------------
function buildCard(match) {
  const card = document.createElement("div");
  card.className = "match";
  card.innerHTML = `
    <header><span class="policy"></span><span class="badge match-id"></span>
      <span class="badge action" style="margin-left:auto"></span></header>
    <div class="watch"></div>
    <canvas class="map"></canvas>
    <div class="bar"><i></i></div>
    <div class="rows">
      <div class="row"><span>${t("step")}</span><span class="f-step"></span></div>
      <div class="row"><span>${t("wave")}</span><span class="f-wave"></span></div>
      <div class="row"><span>${t("reward")}</span><span class="f-reward"></span></div>
      <div class="row"><span>${t("built")}</span><span class="f-built"></span></div>
    </div>
    <div class="items"></div>`;
  card.onclick = () => openDetail(match.index);
  document.getElementById("matches").append(card);
  cards.set(match.index, card);
  return card;
}

function updateCard(match) {
  const card = cards.get(match.index) || buildCard(match);
  card.classList.toggle("dead", !match.alive);
  card.querySelector(".policy").textContent = match.policy;
  card.querySelector(".match-id").textContent = "#" + match.index;
  card.querySelector(".action").textContent = match.action || "-";
  card.querySelector(".bar i").style.width = (match.progress * 100).toFixed(1) + "%";
  card.querySelector(".f-step").textContent = `${match.step}/${match.max_steps}`;
  card.querySelector(".f-wave").textContent = match.wave;
  const reward = card.querySelector(".f-reward");
  reward.textContent = match.reward.toFixed(2);
  reward.style.color = match.reward > 0 ? "var(--good)" : match.reward < 0 ? "var(--bad)" : "";
  card.querySelector(".f-built").textContent = match.built.length;

  // The dashboard draws a map. The real game is one join away, and that is where the
  // animations, the units and the waves actually are.
  const watch = card.querySelector(".watch");
  watch.classList.toggle("on", !!match.watchable && !!match.game_port);
  if (match.watchable && match.game_port) {
    watch.innerHTML = `${t("watchInGame")} <b>127.0.0.1:${match.game_port}</b>`;
  }

  const items = card.querySelector(".items");
  items.innerHTML = "";
  for (const [name, amount] of Object.entries(match.items || {})) {
    const chip = document.createElement("span");
    chip.className = "item";
    chip.innerHTML = `${name} <b>${amount}</b>`;
    items.append(chip);
  }

  loadTerrain(match.index, match.terrain_version).then(terrain =>
    drawMap(card.querySelector("canvas"), match, terrain, 0));
}

// Detail -----------------------------------------------------------------------
function openDetail(index) {
  detailIndex = index;
  document.getElementById("detail").classList.add("open");
}
document.getElementById("d-close").onclick = () => {
  detailIndex = null;
  document.getElementById("detail").classList.remove("open");
};
document.addEventListener("keydown", e => {
  if (e.key === "Escape") document.getElementById("d-close").click();
});

function updateDetail(match) {
  document.getElementById("d-title").textContent = `${match.policy} #${match.index}`;
  document.getElementById("d-step").textContent = `${match.step}/${match.max_steps}`;
  document.getElementById("d-wave").textContent = match.wave;
  document.getElementById("d-reward").textContent = match.reward.toFixed(2);
  document.getElementById("d-built").textContent = match.built.length;
  document.getElementById("d-action").textContent = match.action || "-";
  document.getElementById("d-items").textContent =
    Object.entries(match.items || {}).map(([k, v]) => `${k} ${v}`).join("  ") || "-";
  loadTerrain(match.index, match.terrain_version).then(terrain =>
    drawMap(document.getElementById("d-canvas"), match, terrain, 90));
}

// Curves -----------------------------------------------------------------------
function drawLearning(generations) {
  const canvas = document.getElementById("learning");
  const ctx = canvas.getContext("2d");
  const ratio = window.devicePixelRatio || 1;
  canvas.width = canvas.clientWidth * ratio;
  canvas.height = 150 * ratio;
  ctx.fillStyle = "#08080d";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const points = generations.filter(g => g.mean_reward !== null);
  if (points.length < 2) {
    ctx.fillStyle = "#8a8797";
    ctx.font = `${12 * ratio}px ui-monospace, monospace`;
    ctx.fillText(t("waiting"), 10 * ratio, 24 * ratio);
    return;
  }

  const values = points.map(p => p.mean_reward);
  const min = Math.min(...values), max = Math.max(...values);
  const span = (max - min) || 1;
  const stepX = canvas.width / (points.length - 1);
  const yOf = v => canvas.height - ((v - min) / span) * (canvas.height - 20 * ratio) - 10 * ratio;

  if (min < 0 && max > 0) {
    ctx.strokeStyle = "#2a2a38";
    ctx.beginPath(); ctx.moveTo(0, yOf(0)); ctx.lineTo(canvas.width, yOf(0)); ctx.stroke();
  }

  // Raw per generation faint, smoothed on top: the raw series is too noisy to read a
  // trend from, and the smoothed one alone hides how noisy it is.
  ctx.strokeStyle = "rgba(255,211,127,.25)";
  ctx.lineWidth = ratio;
  ctx.beginPath();
  points.forEach((p, i) => i ? ctx.lineTo(i * stepX, yOf(p.mean_reward)) : ctx.moveTo(0, yOf(p.mean_reward)));
  ctx.stroke();

  const w = Math.max(2, Math.round(points.length / 12));
  ctx.strokeStyle = "#ffd37f";
  ctx.lineWidth = 2 * ratio;
  ctx.beginPath();
  points.forEach((p, i) => {
    const slice = values.slice(Math.max(0, i - w + 1), i + 1);
    const avg = slice.reduce((a, b) => a + b, 0) / slice.length;
    i ? ctx.lineTo(i * stepX, yOf(avg)) : ctx.moveTo(0, yOf(avg));
  });
  ctx.stroke();

  const n = Math.min(5, values.length);
  const first = values.slice(0, n).reduce((a, b) => a + b, 0) / n;
  const last = values.slice(-n).reduce((a, b) => a + b, 0) / n;
  const delta = last - first;
  document.getElementById("s-curmean").textContent = last.toFixed(3);
  const deltaEl = document.getElementById("s-delta");
  deltaEl.textContent = (delta >= 0 ? "+" : "") + delta.toFixed(3);
  deltaEl.style.color = delta > 0 ? "var(--good)" : delta < 0 ? "var(--bad)" : "";
  document.getElementById("s-entropy").textContent = points[points.length - 1].entropy.toFixed(2);
}

// Poll -------------------------------------------------------------------------
async function refresh() {
  try {
    await loadAtlas();
    const state = await (await fetch("state", { cache: "no-store" })).json();
    document.getElementById("s-live").textContent = t("live");

    const totals = state.totals;
    document.getElementById("s-task").textContent = state.title;
    document.getElementById("s-matches").textContent = totals.matches;
    document.getElementById("s-episodes").textContent = totals.episodes;
    document.getElementById("s-updates").textContent = totals.updates || 0;
    document.getElementById("s-bestwave").textContent = totals.best_wave || 0;
    document.getElementById("s-sps").textContent = totals.steps_per_second;
    document.getElementById("s-elapsed").textContent = Math.round(state.elapsed) + "s";

    if (state.matches.length) {
      const empty = document.querySelector("#matches .empty");
      if (empty) empty.remove();
      document.getElementById("s-objective").textContent = state.matches[0].objective || "-";
      state.matches.forEach(updateCard);
      if (detailIndex !== null) {
        const match = state.matches.find(m => m.index === detailIndex);
        if (match) updateDetail(match);
      }
    }

    const board = document.getElementById("s-leaderboard");
    board.innerHTML = "";
    for (const row of state.leaderboard.slice(0, 8)) {
      const li = document.createElement("li");
      li.innerHTML = `<b>${row.policy}</b> #${row.match} - ${row.best.toFixed(2)} / ${row.solved}/${row.episodes} ${t("solved")}`;
      board.append(li);
    }
    if (!state.leaderboard.length) board.innerHTML = `<li class="empty">${t("noResults")}</li>`;

    drawLearning(state.generations || []);
  } catch {
    document.getElementById("s-live").textContent = t("disconnected");
  }
}

applyLanguage();
refresh();
setInterval(refresh, 600);
</script>
</body>
</html>
